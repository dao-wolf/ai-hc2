name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy strict)
        run: mypy --strict src

      - name: Unit tests with coverage
        env:
          PYTHONPATH: src
        run: coverage run -m unittest discover -s tests

      - name: Coverage report
        run: coverage report

      - name: Privacy gate
        env:
          DENYLIST_B64: ${{ secrets.HC2_PRIVACY_DENYLIST_B64 }}
        run: |
          if [ -n "$DENYLIST_B64" ]; then
            denylist="$(mktemp)"
            trap 'rm -f "$denylist"' EXIT
            printf '%s' "$DENYLIST_B64" | base64 --decode > "$denylist"
            HC2_PRIVACY_DENYLIST="$denylist" python scripts/privacy_gate.py --require-denylist
          else
            echo "::notice::HC2_PRIVACY_DENYLIST_B64 is not set, so only the generic privacy checks ran."
            python scripts/privacy_gate.py --generic-only
          fi
