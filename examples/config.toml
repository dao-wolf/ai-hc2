# AI HC2 example configuration.
#
# Copy this file to ~/.config/ai-hc2/config.toml (or to $HC2_CONFIG_DIR/config.toml)
# and change what you need. Every value below is made up.
#
# Status: pre-alpha. This file lists the options planned in docs/requirements.md
# (FR-3, FR-5, FR-16, F-3, Op-2). Names may still change.
#
# Precedence (C-1): a command-line flag beats an environment variable, which
# beats this file, which beats the defaults.
#
# Read today: privacy.confidential_folders, privacy.confidential_terms,
# privacy.redact_all_titles,
# scan.adapter_timeout_seconds, rules.stale_session.idle_hours,
# audit.retention_days and the [adapters] switches. Every other setting is
# planned: HC2 does not read it yet, but a change to any of them still raises a
# "config changed" finding (S-7).
#
# Environment variables for the settings above: HC2_CONFIDENTIAL_FOLDERS
# (separated like PATH), HC2_CONFIDENTIAL_TERMS (separated by commas),
# HC2_ADAPTER_TIMEOUT_SECONDS, HC2_STALE_HOURS,
# HC2_RETENTION_DAYS, HC2_ENABLE_ADAPTERS and HC2_DISABLE_ADAPTERS (comma
# separated adapter ids).
#
# The values shown are the intended defaults unless a comment says otherwise.

# Version of this file's layout.
schema = 1

# ---------------------------------------------------------------------------
# Privacy
# ---------------------------------------------------------------------------
[privacy]
# Folders whose sessions are confidential. Sessions under these folders are
# shown as "Confidential A", "Confidential B" and so on, in the order listed.
# Their titles and paths never appear in any surface, log, export or LLM
# payload. Each entry matches the folder and everything below it.
confidential_folders = [
  "/home/alice/clients/example-client",
  "/home/alice/legal/example-matter",
]

# Words or phrases that mark a session as confidential wherever it lives. A
# session whose title or folder contains one is shown as "Confidential (by
# title)", with no title or folder, and the term itself never appears in any
# output. Matching ignores case and needs the whole word: "tarn" does not match
# "starnet".
confidential_terms = [
  "example-codename",
  "example merger",
]

# Mask every session title, not only confidential ones. Titles then show as
# "Title hidden".
redact_all_titles = false

# ---------------------------------------------------------------------------
# Scanning
# ---------------------------------------------------------------------------
[scan]
# How often a background scan runs, in minutes. 0 means only on request.
interval_minutes = 15

# Give each adapter this long, in seconds, before it is reported as unknown.
adapter_timeout_seconds = 10

# While this file exists, HC2 does not start heavy work (F-3). Point it at the
# lock your own heavy jobs create. Leave it empty to turn the check off.
heavy_work_lock_file = "/home/alice/.cache/example-heavy-jobs.lock"

# ---------------------------------------------------------------------------
# Adapters: one switch per harness, plus options. The key is the adapter id
# with underscores for hyphens: claude_code_cli is the adapter claude-code-cli.
# An adapter that is not listed is on.
# ---------------------------------------------------------------------------
[adapters]
claude_code_cli = true
claude_desktop_code = true
claude_desktop_cowork = true
codex = true
pi = true
hermes = true
ollama = true
lm_studio = true
cursor = true
antigravity = true

# Per-adapter options. Look for pi's data here instead of ~/.pi/agent.
# Leave it empty for the default.
[adapter_options.pi]
agent_dir = ""

# ---------------------------------------------------------------------------
# Rules: a switch and thresholds per rule. A rule that is switched off never
# runs, and a threshold changes when it raises a finding.
# ---------------------------------------------------------------------------
[rules.stale_session]
enabled = true
# A session idle for longer than this many hours is stale (FR-3).
idle_hours = 2

[rules.resources]
# Thresholds for the resource rules (FR-5). The names and values below are the
# built-in defaults, from the resource spike; a key you leave out keeps its
# default, and unknown or non-numeric keys are ignored. Memory sizes are in
# megabytes, CPU in percent of one core, times as named.
enabled = true
swap_red_percent = 80.0
swap_amber_percent = 50.0
compressor_percent_of_ram = 25.0
free_percent_min = 15.0
idle_info_hours = 6.0
idle_amber_hours = 24.0
idle_cpu_max = 3.0
busy_quiet_minutes = 45.0
busy_quiet_cpu_max = 2.0
orphan_min_age_minutes = 10.0
orphan_red_mb = 500.0
orphan_red_cpu = 25.0
heavy_job_cpu = 40.0
heavy_job_mb = 500.0
heavy_jobs_allowed = 1
duplicate_mcp_min_instances = 2
duplicate_mcp_amber_mb = 100.0
duplicate_mcp_red_mb = 500.0
hot_child_cpu = 60.0
hot_child_minutes = 15.0
hot_child_red_cpu = 150.0
renderer_mb = 1500.0

[rules.model_fit]
# Information only: a more powerful model than an idle or simple session needs.
enabled = true

# ---------------------------------------------------------------------------
# Findings
# ---------------------------------------------------------------------------
[findings]
# Default length of an acknowledgement, in days. 0 means until you remove it.
acknowledge_days = 14

# ---------------------------------------------------------------------------
# Local web dashboard
# ---------------------------------------------------------------------------
[serve]
# HC2 always binds to 127.0.0.1. Only the port is configurable.
port = 8765

# ---------------------------------------------------------------------------
# Network (off by default; everything here is opt-in, S-1)
# ---------------------------------------------------------------------------
[network]
# Allow checks for the latest harness versions and changes to docs.
check_versions = false
check_docs = false

# Hosts HC2 may contact when the switches above are on. Nothing else is allowed.
allowed_hosts = [
  "registry.npmjs.org",
  "api.github.com",
  "github.com",
  "code.claude.com",
  "docs.example.com",
]

# ---------------------------------------------------------------------------
# Audit trail and telemetry
# ---------------------------------------------------------------------------
[audit]
# Delete audit files and snapshots older than this many days (Op-2).
retention_days = 30

[telemetry]
# Push the audit trail over OTLP/HTTP (FR-15). Off unless you switch it on.
otlp_export = false
otlp_endpoint = "http://127.0.0.1:4318"

# HC2 holds no secrets. If your endpoint needs a header, name the environment
# variable that holds it here. The value is read at run time and never stored.
otlp_headers_env = ""

# ---------------------------------------------------------------------------
# Surfaces
# ---------------------------------------------------------------------------
[notifications]
# Notify when a new red finding appears (Mac menu bar app).
red_findings = false

# ---------------------------------------------------------------------------
# Plan view (FR-17): off by default.
# ---------------------------------------------------------------------------
[plan]
enabled = false
# A personal plan file of workstreams, decisions and phases. Keep it outside
# the repo.
file = "/home/alice/.config/ai-hc2/plan.json"
