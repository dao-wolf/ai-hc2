[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-hc2"
dynamic = ["version"]
description = "One local place to see and steer every AI harness on a developer's machine."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AI HC2 contributors" }]
keywords = ["ai", "agents", "harness", "observability", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Typing :: Typed",
]
# No runtime dependencies: standard library only (see ADR 0001, decision 7).
dependencies = []

[project.optional-dependencies]
# Listed so contributors and CI know what to install. Nothing here is needed to run HC2.
dev = [
    "coverage>=7.6",
    "mypy>=1.13",
    "ruff>=0.8",
]
# Only for `make mutation`. Kept out of `dev` so CI does not install it.
mutation = [
    "mutmut>=3.8",
]

[project.scripts]
hc2 = "hc2.cli:main"

[tool.hatch.version]
path = "src/hc2/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hc2"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "scripts", "LICENSE", "README.md"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.mutmut]
source_paths = [
    "scripts/privacy_gate.py",
    "scripts/privacy_gate_generic.py",
    "scripts/privacy_gate_git.py",
]
# Kept by hand: add each new tests/test_privacy_gate_*.py file here, except
# test_privacy_gate_hooks.py and test_privacy_gate_make.py, which run real hooks
# and make (see the deselect below).
pytest_add_cli_args_test_selection = [
    "tests/test_privacy_gate.py",
    "tests/test_privacy_gate_defaults.py",
    "tests/test_privacy_gate_encoding.py",
    "tests/test_privacy_gate_exit_codes.py",
    "tests/test_privacy_gate_files.py",
    "tests/test_privacy_gate_home_paths.py",
    "tests/test_privacy_gate_identity.py",
    "tests/test_privacy_gate_loader.py",
    "tests/test_privacy_gate_range.py",
    "tests/test_privacy_gate_range_cases.py",
    "tests/test_privacy_gate_skipped.py",
]
also_copy = ["scripts/install-hooks.sh"]
# The hook tests start the script from a temporary repo, where mutmut can't find its config.
pytest_add_cli_args = ["--deselect", "tests/test_privacy_gate.py::HookTests"]

[tool.coverage.run]
source = ["hc2"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
